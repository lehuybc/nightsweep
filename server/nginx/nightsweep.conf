# Bản nginx của server/php/htaccess.txt cho trang CÔNG KHAI https://nightsweep.xyz/ (nginx không đọc .htaccess).
# Đặt file này vào /etc/nginx/conf.d/nightsweep.conf (ngữ cảnh http), sửa các dòng có "SỬA", rồi chạy: nginx -t && systemctl reload nginx
# Nếu VPS dùng panel (aaPanel, CloudPanel, HestiaCP...): giữ server block của panel, chỉ chép phần từ "if ($host" trở xuống vào đó
# và bỏ các location trùng (location /, location ~ \.php$) mà panel đã có.
# Hash CSP phải khớp với bản index.html đang chạy: chạy python3 build.py rồi chép các hash nó in ra vào đây (và vào htaccess.txt).

# https khi chính nginx nhận TLS, hoặc khi Cloudflare (SSL "Flexible") gửi tới qua http với X-Forwarded-Proto: https
map "$scheme:$http_x_forwarded_proto" $nightsweep_https {
    default   0;
    "~^https:" 1;
    "~:https$" 1;
}

server {
    listen 80;
    listen [::]:80;
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name nightsweep.xyz www.nightsweep.xyz;

    ssl_certificate     /etc/ssl/nightsweep/cert.pem;   # SỬA: chứng chỉ (vd. Cloudflare Origin Certificate)
    ssl_certificate_key /etc/ssl/nightsweep/key.pem;    # SỬA

    root /var/www/nightsweep;                           # SỬA: thư mục chứa index.html và các file PHP
    index index.html;
    autoindex off;
    server_tokens off;

    # Luôn dùng HTTPS và tên miền không có www (giống canonical)
    if ($host != "nightsweep.xyz") { return 301 https://nightsweep.xyz$request_uri; }
    if ($nightsweep_https = 0)    { return 301 https://nightsweep.xyz$request_uri; }

    # Không phục vụ file ẩn (.htaccess, thư mục dữ liệu .nsdata-*), thư viện PHP và thư mục dữ liệu
    location ^~ /.well-known/acme-challenge/ { try_files $uri =404; }   # để certbot (HTTP-01) vẫn cấp chứng chỉ được
    location ~ /\.            { deny all; }
    location = /_lib.php      { deny all; }
    location ^~ /night-data/  { deny all; }

    location / {
        try_files $uri $uri/ =404;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Frame-Options "DENY" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        add_header Content-Security-Policy "default-src 'none'; script-src 'self' 'sha256-nA2ZHxOtTdUOcGBrEE60K86150w1F96lzjBFo6opLOM=' 'sha256-CHd2PRKCaGMI7+9hWRgP7zWln41HF264NdXlERn/YbE='; style-src 'self' 'unsafe-inline'; connect-src 'self'; img-src 'self' data:; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    }

    location ~ \.php$ {
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_pass unix:/run/php/php-fpm.sock;        # SỬA: socket PHP-FPM (vd. /run/php/php8.3-fpm.sock)
        # Các file PHP tự gửi header bảo mật của mình (dashboard.php có CSP riêng cho form đăng nhập).
        # Đừng chuyển CSP của trang chính lên mức server: dashboard.php sẽ nhận hai CSP và không gửi được form đăng nhập.
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
    }
}
